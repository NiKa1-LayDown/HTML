<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Social</title>
    <link rel="shortcut icon" href="pacote-d013/favicon.ico" type="image/x-icon">
    <style>
        body {
            height: 97vh;
            background-image: url(pacote-d013/imagens/fundo-madeira.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin-left: -100px;
            margin-top: -8px;
        }

        main {
            min-width: 350px;
            margin: auto;
            background-image: url(pacote-d013/imagens/frame-iphone.png);
            position: relative;
            background-repeat: no-repeat;
            background-position: center center;
            height: 100%;
        }

        iframe {
            background-color: black;
            background-size: contain;
            position: absolute;
            left: 50%;
            top: 50.2%;
            transform: translate(-50%, -50%);
            width: 268px;
            height: 471.5px;
        }

        img {
            border-radius: 30px;
            height: 50px;
            width: auto;
        }

        img:hover {
            height: 57px;
            width: auto;
            transition-duration: 0.2s;
            margin-bottom: -7px;
        }

        p {
            text-align: end;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    
    <main>
        <p>
            <a href="ex0013.home.html" target="frame"><img src="pacote-d013/imagens/logo-home.jpg" alt=""></a>
        </p>
        <p>
            <a href="ex0013.yout.html" target="frame"><img src="pacote-d013/imagens/logo-youtube.jpg" alt=""></a>
        </p>
        <p>
            <a href="ex0013.git.html" target="frame"><img src="pacote-d013/imagens/logo-github.jpg" alt=""></a>
        </p>
        <p>
            <a href="ex0013.insta.html" target="frame"><img src="pacote-d013/imagens/logo-instagram.jpg" alt=""></a>
        </p>
        <p>
            <a href="ex0013.twit.html" target="frame"><img src="pacote-d013/imagens/logo-twitter.jpg" alt=""></a>
        </p>
        <p>
            <a href="ex0013.face.html" target="frame"><img src="pacote-d013/imagens/logo-facebook.jpg" alt=""></a>
        </p>
        <p>
            <a href="ex0013.turn.html" target="frame"><img src="pacote-d013/imagens/logo-desligar.png" alt=""></a>
        </p>
        <iframe id="home" name="frame" src="" frameborder="1"></iframe>
    </main>
</body>
</html>
