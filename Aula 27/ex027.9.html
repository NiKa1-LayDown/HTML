<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .conteiner {
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">BBBBBBBB</div>
        <div class="item">C</div>
        <div class="item">DDDDDDDDDDDDDDDDDDDD</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG</div>
    </div>
</body>
</html>
