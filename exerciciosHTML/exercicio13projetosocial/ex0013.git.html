<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    <style>
        main {
            height: 210vh;
            background-image: url(pacote-d013/imagens/tela-github.jpg);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center center;
            margin-top: -8px;
            margin-left: -8px;
            margin-right: -8px;
        }
        body::-webkit-scrollbar {
            display:none
        }

        footer {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 20px;
            height: 50px;
            background-color: darkred;
            color: white;
            text-align: center;
            padding-top: 20px;
            margin-left: -8px;
            margin-right: -8px;
            margin-bottom: -8px;
        }

        footer:hover {
            background-color: red;
            transition-duration: 0.2s;
        }

        a:hover {
            text-decoration: underline;
        }

        a {
            font-weight: bolder;
            color: white;
            text-decoration: none;
        }

        a::after {
            text-decoration: none;
            content: '🔗';
        }
    </style>
</head>
<body>
    <main>

    </main>
    <footer>
        <a href="https://github.com/gustavoguanabara" target="_blank"> ACESSE AQUI</a>
    </footer>
</body>
</html>
