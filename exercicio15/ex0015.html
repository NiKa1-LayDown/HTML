<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="geral.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="tablet.css">
    <link rel="stylesheet" href="desktop.css">
    <link rel="stylesheet" href="tv.css">
</head>
<body>
    <main>
        <form action="" method="post">
            <h1>Login</h1>
            <p>
                Seja bem vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
            </p>
            <p id="usu">
                <label for="iusuario"><img id="img1" src="simbolo usuario.png" alt=""></label>
                <input  type="text" name="usuario" id="iusuario" required minlength="8" placeholder="Usuário">
            </p>
            <p id="sen">
                <label for="isenha"><img id="img2" src="senha simbolo.png" alt=""></label>
                <input type="password" name="senha" id="isenha" placeholder="Senha" required>
            </p>
            <p>
                <input id="enviar" type="submit" value="Entrar">
            </p>
            <p id="a">
                <a href="">Esqueci minha senha</a>
            </p>
        </form>
    </main>
</body>
</html>
