<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            grid-auto-rows: 100px;
            grid-auto-columns: 1fr;
            gap: 5px;
            place-items: normal normal;
            place-content: normal normal;
        }

        div.caixa1 {
            border: 3PX solid red;
            grid-row: 1 / 2;
            grid-column: 1 / 5;
        }

        div.caixa2 {
            border: 3PX solid red;
            grid-row: 2 / span 2;
            grid-column: 1 / span 2;
        }

        div.caixa3 {
            border: 3PX solid red;
            /*sequência: row-start / column-start / row-end / column-end */
            grid-area: 2 / 3 / -1 / -1;
         /* grid-row-start: 2;
            grid-row-end: -1;
            grid-column-start: 3;
            grid-column-end: -1; */
        }
    </style>
</head>
<body>
    <div class="container"> <!-- usar div.item*n para multiplicar os itens mais rapidamente -->
        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa 2</div>
        <div class="caixa3">Caixa 3</div>
    </div>
</body>
</html>
