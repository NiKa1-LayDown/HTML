<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }
        div.container {
            height: 100vh;
            width: 100vw;
            display: grid;
            border: solid 3px black;
            grid-template: 120px 60px 1fr 60px / 1fr 250px;
            gap: 5px;
        }

        div.caixa1 {
            border: solid 3px red;
            grid-area: 1 / 1 / 2 / 3;
        }

        div.caixa2 {
            border: solid 3px green;
            grid-area: 2/ 1 / 3 / 3;
        }

        div.caixa3 {
            border: solid 3px yellow;
            grid-area: 3 / 1 / 4 / 2;
        }

        div.caixa4 {
            border: solid 3px blue;
            grid-area: 3 / 2 / 4 / 3;
        }

        div.caixa5 {
            border: solid 3px orange;
            grid-area: 4 / 1 / 5 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1"></div>
        <div class="caixa2"></div>
        <div class="caixa3"></div>
        <div class="caixa4"></div>
        <div class="caixa5"></div>
    </div>
</body>
</html>
