<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Hamburguer</title>
    <script src="https://kit.fontawesome.com/383512bcde.js" crossorigin="anonymous"></script>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-image: url(Fotos/paisagem.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        nav {
            background-color: white;
        }

        ul {
            list-style: none;
            display: flex;
            justify-content: flex-end;
        }

        li {
            height: 50px;
            padding: 0px 20px;
            margin: 0px 1px;
            display: flex;
            align-items: center;
            transition: background-color 0.2s;
        }

        li:hover {
            cursor: pointer;
            background-color: lightgray;
        }

        li:first-child {
            margin-right: auto;
        }

        li:first-child:hover {
            background-color: white;
            cursor: auto;
        }

        #side {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 250px;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.356);
            backdrop-filter: blur(10px);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.527);
            display: none;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
        }

        #side li {
            width: 100%;
        }

        #side li:first-child:hover {
            cursor: pointer;
        }

        @media screen and (min-width: 700px) {
            #menu {
                display: none;
            }
        }

        @media screen and (max-width: 700px) {
            .esconder {
                display: none;
            }
        }

        @media screen and (max-width: 500px) {
            #side {
                width: 100vw;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <nav>
                <ul id="side">
                    <li onclick="fechar()"><i class="fa-solid fa-xmark"></i></li>
                    <li>Home</li>
                    <li>Blog</li>
                    <li>Products</li>
                    <li>Contact</li>
                    <li>About us</li>
                </ul>

                <ul>
                    <li>HAMBURGUER</li>
                    <li class="esconder">Home</li>
                    <li class="esconder">Blog</li>
                    <li class="esconder">Products</li>
                    <li class="esconder">Contact</li>
                    <li class="esconder">About us</li> 
                    <li id="menu" onclick="abrir()"><i class="fa-solid fa-bars"></i></li>
                </ul>
            </nav>
        </header>
    </main>
    
    <script>
        function abrir() {
            document.querySelector('ul#side').style.display = 'flex'
        }

        function fechar() {
            document.querySelector('ul#side').style.display = 'none'
        }
    </script>
</body>
</html>
