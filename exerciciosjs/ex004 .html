<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Hamburguer</title>
    <script src="https://kit.fontawesome.com/383512bcde.js" crossorigin="anonymous"></script>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        header {
            background-color: #262626;
        }

        li {
            list-style: none;
        }

        a {
            color: white;
            text-decoration: none
        }

        .navbar {
            min-height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 24px;
        }

        .nav-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 60px;
        }

        .nav-branding {
            font-size: 2rem;
        }

        .nav-link {
            transition: 0.2s ease;
        }

        .nav-link:hover {
            color: dodgerblue;
        }

        .hamburguer {
            display: none;
            cursor: pointer;
        }

        .bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px auto;
            -webkit-transition: all 0.2s ease-in-out;
            transition: all 0.2s ease-in-out;
            background-color: white;
        }

        @media(max-width: 768px) {
            .hamburguer {
                display: block;
            }

            .hamburguer.active .bar:nth-child(2) {
                opacity: 0;
            }

            .hamburguer.active .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }

            .hamburguer.active .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }

            .nav-menu {
                position: fixed;
                left: -100%;
                top: 70px;
                gap: 0;
                flex-direction: column;
                background-color: #262626;
                width: 100%;
                text-align: center;
                transition: 0.2s;
            }

            .nav.item {
                margin: 16px 0px;
            }

            .nav-menu.active {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#" class="nav-branding">DEV.</a>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="" class="nav-link">Home</a></li>
                <li class="nav-item">
                    <a href="" class="nav-link">About</a></li>
                <li class="nav-item">
                    <a href="" class="nav-link">Contact</a></li>
            </ul>

            <div class="hamburguer">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <script>
        const hamburguer = document.querySelector('.hamburguer')
        const navMenu = document.querySelector('.nav-menu')

        hamburguer.addEventListener("click",() => {
            hamburguer.classList.toggle('active')
            navMenu.classList.toggle('active')
        })

        document.querySelectorAll('.nav-link').forEach(n => n.addEventListener("click", () => {
            hamburguer.classList.remove('active')
            navMenu.classList.remove('active')
        }))
    </script>
</body>
</html>
