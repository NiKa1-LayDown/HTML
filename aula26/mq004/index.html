<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="mobile.css" media="all">
    <link rel="stylesheet" href="tablet.css" media="tablet">
    <link rel="stylesheet" href="print.css" media="print">
    <link rel="stylesheet" href="desktop.css" media="screen">
    <link rel="stylesheet" href="tv.css" media="screen">
</head>
<body>
    <main>
        <h1>Testando Media Queries</h1>
        <img id="mobile" src="imagens/icon-phone.png" alt="Versão para phone">
        <img id="tablet" src="imagens/icon-tablet.png" alt="Versão para tablet">
        <img id="print" src="imagens/icon-print.png" alt="Versão para impressão">
        <img id="desktop" src="imagens/icon-pc.png" alt="Versão para desktop">
        <img id="tv" src="imagens/icon-tv.png" alt="Versão para tv">
    </main>
</body>
</html>
